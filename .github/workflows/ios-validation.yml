name: iOS and vocabulary validation

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'data/**'
      - 'scripts/**'
      - '.gitattributes'
      - '.github/workflows/ios-validation.yml'
  push:
    branches: [main, chatgpt-design-ios]
    paths:
      - 'ios/**'
      - 'data/**'
      - 'scripts/**'
      - '.gitattributes'
      - '.github/workflows/ios-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vocabulary:
    name: Verify complete vocabulary snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test importer and committed assets
        run: node --test scripts/vocabulary.test.mjs
      - name: Verify source and resource hashes without network access
        run: node scripts/vocabulary.mjs --check

  ios:
    name: Build and test iPhone app
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select an installed iPhone simulator
        id: simulator
        shell: bash
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          devices = json.loads(Path(os.environ['RUNNER_TEMP'], 'simulators.json').read_text())['devices']
          runtimes = [runtime for runtime in devices if '.iOS-' in runtime]
          runtimes.sort(key=lambda runtime: tuple(int(part) for part in runtime.rsplit('iOS-', 1)[1].split('-')), reverse=True)
          for runtime in runtimes:
              phones = [device for device in devices[runtime] if device['name'].startswith('iPhone') and device.get('isAvailable', False)]
              if phones:
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write('udid=' + phones[0]['udid'] + '\n')
                  print('Testing on ' + phones[0]['name'] + ' (' + runtime + ')')
                  break
          else:
              raise SystemExit('No available iPhone simulator found')
          PY
      - name: Build and run XCTest suite
        shell: bash
        run: |
          xcodebuild test \
            -project ios/VocabularyTrainer.xcodeproj \
            -scheme VocabularyTrainer \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/VocabularyTrainerDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/VocabularyTrainer.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Preserve Xcode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/VocabularyTrainer.xcresult
          if-no-files-found: ignore
