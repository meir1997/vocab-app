name: Offline web validation
on:
  pull_request:
    paths: ['app.js', 'quiz-content.js', 'styles.css', 'index.html', 'sw.js', 'scripts/**', '.github/workflows/offline-web.yml']
  push:
    branches: [main]
    paths: ['app.js', 'quiz-content.js', 'styles.css', 'index.html', 'sw.js', 'scripts/**', '.github/workflows/offline-web.yml']
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Coverage compares with the merged PR 13 presentation.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/vocabulary.test.mjs scripts/quiz-content.test.cjs scripts/epub-reader.test.cjs
      - run: node scripts/example-coverage.cjs
      - run: node scripts/quiz-ux-browser.test.cjs
      - run: node scripts/learning-rule-browser.test.cjs
      - run: node scripts/feedback-layout-browser.test.cjs --screenshots test-results/feedback
      - run: node scripts/safe-area-browser.test.cjs --screenshots test-results/safe-area
      - run: node scripts/sense-examples-browser.test.cjs
      - run: node scripts/visual-layout-browser.test.cjs
      - run: node scripts/topbar-stability-browser.test.cjs
      - run: node scripts/reader-browser.test.cjs
      - run: node scripts/offline-browser.test.cjs
      - run: node scripts/reconnect-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-layout-evidence
          path: test-results/
          if-no-files-found: ignore
